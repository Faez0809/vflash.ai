{% extends "base.html" %}

{% block title %}Flashcards | VocabAI{% endblock %}

{% block content %}
<section class="panel flashcard-panel">
    <div class="panel-heading">
        <h1>Flashcards</h1>
        <span class="badge">{{ user_words|length }} cards</span>
    </div>

    {% if user_words %}
        <div
            id="flashcard-app"
            data-cards='[
            {% for item in user_words %}
                {
                    "id": {{ item.id }},
                    "word": {{ item.word_entry.word|tojson }},
                    "meaning": {{ item.word_entry.meaning|tojson }},
                    "sentence": {{ (item.word_entry.sentence or "No example yet.")|tojson }}
                }{{ "," if not loop.last }}
            {% endfor %}
            ]'
        >
            <article class="word-card flashcard">
                <div class="flashcard-count" id="flashcard-count"></div>
                <h2 id="flashcard-word"></h2>
                <div id="flashcard-details" class="flashcard-details is-hidden">
                    <p><strong>Meaning:</strong> <span id="flashcard-meaning"></span></p>
                    <p><strong>Sentence:</strong> <span id="flashcard-sentence"></span></p>
                </div>
                <div class="flashcard-actions">
                    <button type="button" id="show-meaning-btn">Show Meaning</button>
                    <button type="button" id="mark-learned-btn">Mark as Learned</button>
                    <button type="button" id="next-word-btn" class="button-secondary">Next Word</button>
                </div>
                <p id="flashcard-status" class="muted"></p>
            </article>
        </div>
    {% else %}
        <p class="empty-state">No more words to study</p>
    {% endif %}
</section>
{% endblock %}
